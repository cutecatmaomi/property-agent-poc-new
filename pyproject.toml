[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "property-ontology-poc"
version = "0.1.0"
description = "Property ontology POC: document extraction and tenant-scoped Neo4j business actions"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "pdfplumber>=0.11,<0.12",
  "python-docx>=1.2,<2",
  "Pillow>=11,<13",
  "neo4j>=6.4,<7",
  "langgraph>=1.0,<2",
  "streamlit>=1.50,<2",
  "numpy>=2,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
ocr = ["rapidocr>=3.4,<4", "onnxruntime>=1.20,<2"]

[project.scripts]
property-poc = "property_ontology.cli:main"
property-poc-day2 = "property_ontology.day2_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the isolated local Neo4j test instance"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/property_ontology"]
